name: Fix Release ZIP Module Detector

on:
  push:
    branches: [codex/android-runtime-test]
    paths:
      - .github/workflows/fix-release-module-detector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-runtime-test

      - name: Patch detector without changing source toolchain logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-asset-runtime-test.yml')
          text = path.read_text()
          old = '''            while IFS= read -r file; do
              if grep -Eq "com\\.android\\.application|apply[[:space:]]+plugin:[[:space:]]*['\\\"]com\\.android\\.application['\\\"]" "$file" &&
                 ! grep -Eq "com\\.android\\.application['\\\"]?\\)?[[:space:]]+apply[[:space:]]+false" "$file"; then
                dir="$(dirname "$file")"
'''
          new = '''            while IFS= read -r file; do
              if grep -Eq "apply[[:space:]]+plugin:[[:space:]]*['\\\"]com\\.android\\.application['\\\"]" "$file" ||
                 grep -E "id[[:space:]]*(\\([[:space:]]*)?['\\\"]com\\.android\\.application['\\\"]" "$file" |
                   grep -Ev "apply[[:space:]]+false" >/dev/null; then
                dir="$(dirname "$file")"
'''
          if old not in text:
              raise SystemExit('expected detector block not found; refusing blind patch')
          updated = text.replace(old, new, 1)
          if updated == text:
              raise SystemExit('no change made')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- .github/workflows/release-asset-runtime-test.yml

      - name: Commit detector fix to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-asset-runtime-test.yml
          git commit -m 'Fix Release ZIP application module detection'
          git push origin HEAD:codex/android-runtime-test
