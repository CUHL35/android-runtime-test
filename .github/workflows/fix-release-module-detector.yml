name: Fix Release ZIP Module Detector

on:
  push:
    branches: [codex/android-runtime-test]
    paths:
      - .github/workflows/fix-release-module-detector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/android-runtime-test

      - name: Patch detector without changing source toolchain logic
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import base64; p=Path('.github/workflows/release-asset-runtime-test.yml'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'expected detector block not found'; p.write_text(s.replace(old,new,1))"
          git diff --check
          git diff -- .github/workflows/release-asset-runtime-test.yml

      - name: Commit detector fix to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-asset-runtime-test.yml
          git commit -m 'Fix Release ZIP application module detection'
          git push origin HEAD:codex/android-runtime-test
