name: APK PRO v42 Debug

on:
  push:
    branches: [apk-pro-v42-debug]
    paths:
      - '.github/workflows/apk-pro-v42-debug.yml'
      - 'runtime-tests/apk-pro-v42-delta/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"

      - name: Stage APK PRO v42 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/apk-pro-v42"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -a runtime-tests/apk-pro-v35/source/. "$ROOT/"
          cat runtime-tests/apk-pro-v42-delta/part*.b64 | base64 -d > "$RUNNER_TEMP/v42-delta.zip"
          unzip -oq "$RUNNER_TEMP/v42-delta.zip" -d "$ROOT"
          rm -rf "$ROOT/release-signing"
          grep -F "versionCode 42" "$ROOT/app/build.gradle"
          grep -F "versionName '42'" "$ROOT/app/build.gradle"
          grep -F "compileSdk 37" "$ROOT/app/build.gradle"
          grep -F "buildToolsVersion '36.0.0'" "$ROOT/app/build.gradle"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          gradle clean assembleDebug --no-daemon --console=plain --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp "$APK" "$RUNNER_TEMP/apk-out/APK-PRO-v42-debug.apk"
          sha256sum "$RUNNER_TEMP/apk-out/APK-PRO-v42-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: APK-PRO-v42-debug
          path: ${{ runner.temp }}/apk-out/APK-PRO-v42-debug.apk
          if-no-files-found: error
          retention-days: 1
