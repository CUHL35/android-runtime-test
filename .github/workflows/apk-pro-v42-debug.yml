name: APK PRO W^X Debug

on:
  push:
    branches: [apk-pro-v42-debug]
    paths:
      - '.github/workflows/apk-pro-v42-debug.yml'
      - 'runtime-tests/apk-pro-v42-delta/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Install exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"

      - name: Stage APK PRO source + W^X fix
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/apk-pro-wxfix"
          DELTA="$RUNNER_TEMP/v42-delta.zip"
          rm -rf "$ROOT" "$DELTA"
          mkdir -p "$ROOT"
          test -f runtime-tests/apk-pro-v35/source/app/build.gradle
          cp -a runtime-tests/apk-pro-v35/source/. "$ROOT/"
          cat runtime-tests/apk-pro-v42-delta/part*.b64 | tr -d '\r\n' | base64 -d > "$DELTA"
          unzip -oq "$DELTA" -x 'app/src/main/java/com/longdev/apkbuilder/core/ToolchainManager.java' -d "$ROOT"
          rm -rf "$ROOT/release-signing" "$ROOT/.git" "$ROOT/.gradle" "$ROOT/app/build" "$ROOT/build"
          sed -i \
            -e 's/versionCode 42/versionCode 43/' \
            -e "s/versionName '42'/versionName '43'/" \
            -e 's/minSdk 30/minSdk 28/' \
            -e 's/targetSdk 33/targetSdk 28/' \
            "$ROOT/app/build.gradle"
          grep -E 'versionCode|versionName|minSdk|targetSdk|compileSdk' "$ROOT/app/build.gradle"
          grep -q 'versionCode 43' "$ROOT/app/build.gradle"
          grep -q "versionName '43'" "$ROOT/app/build.gradle"
          grep -q 'minSdk 28' "$ROOT/app/build.gradle"
          grep -q 'targetSdk 28' "$ROOT/app/build.gradle"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build Debug
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ROOT"
          gradle clean assembleDebug --no-daemon --console=plain --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp "$APK" "$RUNNER_TEMP/apk-out/APK-PRO-v43-wxfix-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RUNNER_TEMP/apk-out/APK-PRO-v43-wxfix-debug.apk" | tee "$RUNNER_TEMP/apk-out/badging.txt"
          grep -q "sdkVersion:'28'" "$RUNNER_TEMP/apk-out/badging.txt"
          grep -q "targetSdkVersion:'28'" "$RUNNER_TEMP/apk-out/badging.txt"
          sha256sum "$RUNNER_TEMP/apk-out/APK-PRO-v43-wxfix-debug.apk"

      - name: Export clean source ZIP
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$ROOT/.gradle" "$ROOT/app/build" "$ROOT/build"
          cd "$ROOT"
          zip -qr "$RUNNER_TEMP/apk-out/APK-PRO-v43-SOURCE-NOKEY.zip" . \
            -x '.git/*' '.gradle/*' 'app/build/*' 'build/*' '*.apk' '*.aab'
          unzip -tqq "$RUNNER_TEMP/apk-out/APK-PRO-v43-SOURCE-NOKEY.zip"
          sha256sum "$RUNNER_TEMP/apk-out/APK-PRO-v43-SOURCE-NOKEY.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: APK-PRO-v43-wxfix-bundle
          path: |
            ${{ runner.temp }}/apk-out/APK-PRO-v43-wxfix-debug.apk
            ${{ runner.temp }}/apk-out/APK-PRO-v43-SOURCE-NOKEY.zip
          if-no-files-found: error
          retention-days: 1
