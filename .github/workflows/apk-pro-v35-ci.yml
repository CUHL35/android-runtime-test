name: APK PRO v36 Release Gate

on:
  push:
    branches: [apk-pro-v35-ci]
    paths:
      - '.github/workflows/apk-pro-v35-ci.yml'
      - 'runtime-tests/apk-pro-v35/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
      - name: Stage complete APK PRO v36 source without private signing material
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/apk-pro-v36"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cp -a runtime-tests/apk-pro-v35/source/. "$ROOT/"
          (
            cd "$ROOT"
            sha256sum -c "$GITHUB_WORKSPACE/runtime-tests/apk-pro-v35/source-ci.sha256"
          )
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Verify declared toolchain and version
        shell: bash
        run: |
          set -euo pipefail
          grep -F "version '9.3.2'" "$ROOT/build.gradle"
          grep -F "compileSdk 37" "$ROOT/app/build.gradle"
          grep -F "targetSdk 33" "$ROOT/app/build.gradle"
          grep -F "buildToolsVersion '36.0.0'" "$ROOT/app/build.gradle"
          grep -F "versionCode 36" "$ROOT/app/build.gradle"
          grep -F "versionName '36'" "$ROOT/app/build.gradle"
          gradle --version
      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
      - name: Build Debug and unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          gradle clean assembleDebug assembleRelease --no-daemon --console=plain --stacktrace
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp "$DEBUG_APK" "$RUNNER_TEMP/apk-out/APK-PRO-v36-debug.apk"
          cp "$RELEASE_APK" "$RUNNER_TEMP/apk-out/APK-PRO-v36-release-unsigned.apk"
          sha256sum "$RUNNER_TEMP/apk-out/"*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pro-v36-debug
          path: ${{ runner.temp }}/apk-out/APK-PRO-v36-debug.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pro-v36-release-unsigned
          path: ${{ runner.temp }}/apk-out/APK-PRO-v36-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  runtime:
    needs: build
    uses: ./.github/workflows/android-runtime-test.yml
    with:
      apk_artifact_name: apk-pro-v36-debug
      package_name: com.apkbld
      launch_component: com.apkbld/com.longdev.apkbuilder.MainActivity

