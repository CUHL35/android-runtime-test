name: Generate Gradle 9.5 wrapper

on:
  push:
    branches: [probe-adb-v30-toolchain]
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Generate official wrapper
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf wrapper-out wrapper-proj
          mkdir -p wrapper-proj
          printf "rootProject.name='wrapper-probe'\n" > wrapper-proj/settings.gradle
          printf "\n" > wrapper-proj/build.gradle
          gradle -p wrapper-proj wrapper --gradle-version 9.5.0 --distribution-type bin
          mkdir -p wrapper-out/gradle/wrapper
          cp wrapper-proj/gradlew wrapper-out/
          cp wrapper-proj/gradlew.bat wrapper-out/
          cp wrapper-proj/gradle/wrapper/gradle-wrapper.jar wrapper-out/gradle/wrapper/
          cp wrapper-proj/gradle/wrapper/gradle-wrapper.properties wrapper-out/gradle/wrapper/
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip.sha256 -o wrapper-out/gradle-9.5.0-bin.zip.sha256
          sha256sum wrapper-out/gradle/wrapper/gradle-wrapper.jar > wrapper-out/wrapper-jar.sha256
          cat wrapper-out/gradle-9.5.0-bin.zip.sha256
          cat wrapper-out/wrapper-jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-9.5-official-wrapper
          path: wrapper-out
          if-no-files-found: error
